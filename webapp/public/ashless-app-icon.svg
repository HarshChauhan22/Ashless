<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!--
    App icon: rounded-square field carrying the brand's signature gradient
    (warm ash-charcoal at top-left easing into gold at bottom-right — the
    same "ash resolving into value" story as the symbol, now told across
    the whole field), with the broken-loop mark reversed to flat cream and
    centered. Scaled to sit inside Android's adaptive-icon ~66% safe zone.
  -->
  <defs>
    <linearGradient id="ashlessIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B4640"/>
      <stop offset="55%" stop-color="#8A7A52"/>
      <stop offset="100%" stop-color="#E7B23D"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="240" height="240" rx="52" fill="url(#ashlessIconBg)"/>
